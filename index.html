<title>트래블릿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B3438;
    --teal:#2F6B5C;
    --teal-light:#E4EEE9;
    --cream:#F3ECDB;
    --paper:#FFFDF8;
    --coral:#C15A33;
    --coral-light:#F6E1D1;
    --slate:#6E7B76;
    --line:#E0D2B2;
    --gold:#D9A441;
    --gold-light:#F7EACB;
    --blue:#3D6B8A;
    --plum:#8A3A44;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  #root{max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:88px;}

  ::selection{background:var(--coral-light);}

  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,textarea,select{font-family:var(--font-body);}

  /* ---------- App title bar ---------- */
  .app-bar{
    display:flex;align-items:center;gap:7px;
    padding:18px 20px 4px;
  }
  .app-bar .st-leaf{margin-right:0;}
  .app-name{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--ink);letter-spacing:-0.01em;}

  /* ---------- Header / Boarding pass hero ---------- */
  .hero{
    margin:16px 16px 20px;
    background:linear-gradient(135deg, #1B3438 0%, #142629 100%);
    border-radius:var(--radius);
    color:var(--paper);
    display:flex;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(20,38,41,0.3);
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20420%20220%27%3E%3Cpath%20d%3D%27M420%2C220%20C300%2C220%20245%2C30%20420%2C-10%20Z%27%20fill%3D%27%23D9A441%27%20opacity%3D%270.16%27/%3E%3Cpath%20d%3D%27M420%2C220%20C340%2C220%20300%2C95%20420%2C40%20Z%27%20fill%3D%27%23C15A33%27%20opacity%3D%270.20%27/%3E%3Cpath%20d%3D%27M420%2C220%20C375%2C220%20358%2C150%20420%2C118%20Z%27%20fill%3D%27%23FFFDF9%27%20opacity%3D%270.09%27/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right bottom;
    background-size:65% auto;
    z-index:0;
  }
  .hero-main{flex:1;padding:20px 18px;position:relative;z-index:1;}
  .hero-eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#CBB98C;
    margin-bottom:8px;
  }
  .hero-route{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
    line-height:1.1;
  }
  .hero-route .plane{color:var(--gold);font-size:18px;}
  .hero-dates{
    margin-top:10px;
    font-family:var(--font-mono);
    font-size:13px;
    color:#D9CDAE;
  }
  .hero-tagline{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size:12.5px;
    color:var(--gold);
    margin-top:9px;
    opacity:0.95;
  }
  .hero-stub{
    width:92px;
    border-left:2px dashed rgba(255,253,248,0.35);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    position:relative;
    z-index:1;
    padding:12px 8px;
  }
  .hero-stub::before,.hero-stub::after{
    content:"";
    position:absolute;
    left:-8px;
    width:16px;height:16px;
    background:var(--cream);
    border-radius:50%;
  }
  .hero-stub::before{top:-8px;}
  .hero-stub::after{bottom:-8px;}
  .hero-stub .pax-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:#CBB98C;text-transform:uppercase;}
  .hero-stub .pax-num{font-family:var(--font-display);font-size:26px;font-weight:600;}

  /* ---------- Tabs ---------- */
  .tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    gap:6px;
    z-index:40;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    border-radius:10px;
    padding:9px 4px 7px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--slate);
    font-size:12px;
    font-weight:600;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn .tag-icon{font-size:18px;}
  .tab-btn.active{background:var(--coral-light);color:var(--coral);}

  .content{padding:0 16px;}
  .section-title{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
    margin:6px 2px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title .st-label{display:flex;align-items:center;}
  .section-title .st-leaf{margin-right:7px;flex-shrink:0;}
  .section-sub{font-size:12.5px;color:var(--slate);margin:-8px 2px 14px;}

  .btn{
    border:none;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;
  }
  .btn-teal{background:var(--teal);color:var(--paper);}
  .btn-coral{background:var(--coral);color:var(--paper);}
  .btn-ghost{background:transparent;color:var(--teal);border:1px solid var(--teal-light);}
  .btn-outline{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px;}
  .btn-icon{background:transparent;border:none;color:var(--slate);padding:4px;font-size:15px;line-height:1;border-radius:6px;}
  .btn-confirm-delete{background:var(--coral)!important;color:var(--paper)!important;font-size:11px!important;font-weight:700;padding:4px 8px!important;width:auto;}
  .btn-icon:hover{background:var(--teal-light);color:var(--teal);}

  /* ---------- Day card (ticket stub) ---------- */
  .day-card{
    background:var(--paper);
    border-radius:var(--radius);
    margin-bottom:16px;
    display:flex;
    box-shadow:0 2px 8px rgba(20,38,41,0.08);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .day-side{
    width:64px;
    flex-shrink:0;
    background:linear-gradient(165deg, var(--gold-light) 0%, var(--coral-light) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:14px 4px;
    position:relative;
  }
  .day-side .wk{font-family:var(--font-mono);font-size:11px;color:var(--coral);letter-spacing:.05em;font-weight:600;}
  .day-side .num{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--ink);line-height:1;margin:2px 0;}
  .day-side .mon{font-family:var(--font-mono);font-size:10px;color:var(--slate);}
  .day-divider{
    width:0;border-left:2px dashed var(--line);position:relative;
  }
  .day-divider::before,.day-divider::after{
    content:"";position:absolute;left:-7px;width:14px;height:14px;background:var(--cream);border-radius:50%;
  }
  .day-divider::before{top:-1px;}
  .day-divider::after{bottom:-1px;}
  .day-body{flex:1;padding:14px 14px 12px 18px;min-width:0;}

<!-- ===== Firebase 연동 (claude.ai 없이 가족 실시간 공유용) =====
     아래 firebaseConfig에 본인 Firebase 프로젝트 설정값을 붙여넣으세요.
     Firebase 콘솔 > 프로젝트 설정 > 일반 > "내 앱" 섹션에서 확인 가능해요.
     Firestore Database도 미리 만들어두셔야 해요 (테스트 모드로 시작 가능).
-->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyBpfCZYLH1d13VvJ_w2EMjlWUGd12Kjcs8",
    authDomain: "tripperty-5c5d4.firebaseapp.com",
    projectId: "tripperty-5c5d4",
    storageBucket: "tripperty-5c5d4.firebasestorage.app",
    messagingSenderId: "374511141037",
    appId: "1:374511141037:web:c733b070f45f3b068bc624"
  };

  var TRAVELLET_COLLECTION = 'travellet-sydney';
  var firebaseReady = false;
  var db = null;

  try{
    if(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0){
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      firebaseReady = true;
    } else {
      console.warn('Firebase 설정이 아직 비어있어요. firebaseConfig를 채워주세요.');
    }
  }catch(e){
    console.error('Firebase 초기화 실패:', e);
  }

  // 저장소 우선순위: ① Firebase(설정 시) → ② claude.ai 게시 환경의 내장 공유 저장소 → ③ 인메모리(마지막 폴백)
  var nativeStorage = window.storage || null; // claude.ai 게시 환경이 제공하는 공유 저장소 보존
  var memoryStore = {};
  window.storage = {
    get: function(key){
      if(firebaseReady){
        return db.collection(TRAVELLET_COLLECTION).doc(key).get().then(function(snap){
          if(!snap.exists) throw new Error('not found: ' + key);
          return { key: key, value: snap.data().value };
        });
      }
      if(nativeStorage && typeof nativeStorage.get === 'function'){
        return nativeStorage.get(key, true);
      }
      return new Promise(function(resolve, reject){
        if(!(key in memoryStore)) return reject(new Error('not found: ' + key));
        resolve({ key: key, value: memoryStore[key] });
      });
    },
    set: function(key, value){
      if(firebaseReady){
        return db.collection(TRAVELLET_COLLECTION).doc(key).set({ value: value, updatedAt: Date.now() }).then(function(){
          return { key: key, value: value };
        });
      }
      if(nativeStorage && typeof nativeStorage.set === 'function'){
        return nativeStorage.set(key, value, true);
      }
      memoryStore[key] = value;
      return Promise.resolve({ key: key, value: value });
    }
  };
</script>

  /* ---------------- state ---------------- */
  var state = {
    tab:'itinerary',
    tripInfo: null,
    itinerary: null,
    expenses: null,
    loaded:false,
    modalOpen:false
  };

  /* ---------------- storage ---------------- */
  // 일정 버전: 앱 파일의 기본 일정이 크게 바뀔 때마다 이 값을 올려요.
  // 저장된 버전과 다르면 옛날 일정·여행정보를 자동으로 새 일정으로 교체해요 (경비 기록은 보존).
  var DATA_VERSION = 'v19-restaurants-2026-08-18';

  async function loadAll(){
    var storedVersion = null;
    try{
      var rv = await window.storage.get('data-version', true);
      storedVersion = rv && rv.value ? rv.value : null;
    }catch(e){ storedVersion = null; }

    var needMigration = storedVersion !== DATA_VERSION;

    if(needMigration){
      // 새 버전: 일정·여행정보를 새 기본값으로 교체하고 저장 (경비는 건드리지 않음)
      state.tripInfo = defaultTripInfo();
      state.itinerary = defaultItinerary();
      try{
        await window.storage.set('trip-info', JSON.stringify(state.tripInfo), true);
        await window.storage.set('itinerary', JSON.stringify(state.itinerary), true);
        await window.storage.set('data-version', DATA_VERSION, true);
      }catch(e){ /* 저장 실패해도 화면에는 새 일정 표시 */ }
    } else {
      try{
        var r = await window.storage.get('trip-info', true);
        state.tripInfo = r && r.value ? JSON.parse(r.value) : defaultTripInfo();
      }catch(e){ state.tripInfo = defaultTripInfo(); }

      try{
        var r2 = await window.storage.get('itinerary', true);
        state.itinerary = r2 && r2.value ? JSON.parse(r2.value) : defaultItinerary();
      }catch(e){ state.itinerary = defaultItinerary(); }
    }

    try{
      var r3 = await window.storage.get('expenses', true);
      state.expenses = r3 && r3.value ? JSON.parse(r3.value) : [];
    }catch(e){ state.expenses = []; }

    state.loaded = true;
  }

  async function saveTripInfo(){
    try{ await window.storage.set('trip-info', JSON.stringify(state.tripInfo), true); }
    catch(e){ showToast('저장에 실패했어요. 다시 시도해주세요.'); }
  }
  async function saveItinerary(){
    try{ await window.storage.set('itinerary', JSON.stringify(state.itinerary), true); }
    catch(e){ showToast('저장에 실패했어요. 다시 시도해주세요.'); }
  }
  async function saveExpenses(){
    try{ await window.storage.set('expenses', JSON.stringify(state.expenses), true); }
    catch(e){ showToast('저장에 실패했어요. 다시 시도해주세요.'); }
  }

  /* ---------------- modal helper ---------------- */
  function closeModal(){
    document.getElementById('modal-root').innerHTML = '';
    state.modalOpen = false;
  }

  function openModal(opts){
    state.modalOpen = true;
    // opts: {title, fields:[{key,label,type,value,options}], submitLabel, onSubmit(values), onDelete}
    var root = document.getElementById('modal-root');
    var html = '<div class="modal-backdrop" id="mb"><div class="modal-sheet">';
    html += '<button class="modal-close" data-close="1">✕</button>';
    html += '<div class="modal-title">'+opts.title+'</div>';
    html += '<div id="modal-form">';
    opts.fields.forEach(function(f){
      html += '<div class="field">';
      if(f.type === 'checkbox'){
        html += '<label class="field-check"><input type="checkbox" data-key="'+f.key+'" '+(f.value?'checked':'')+' style="width:16px;height:16px;accent-color:var(--teal);"> '+f.label+'</label>';
      } else {
        html += '<label>'+f.label+'</label>';
        if(f.type === 'select'){
          html += '<select data-key="'+f.key+'">';
          f.options.forEach(function(o){
            var val = typeof o === 'object' ? o.value : o;
            var lab = typeof o === 'object' ? o.label : o;
            html += '<option value="'+val+'" '+(String(val)===String(f.value)?'selected':'')+'>'+lab+'</option>';
          });
          html += '</select>';
        } else if(f.type === 'textarea'){
          html += '<textarea data-key="'+f.key+'" placeholder="'+(f.placeholder||'')+'">'+(f.value||'')+'</textarea>';
        } else {
          html += '<input type="'+f.type+'" data-key="'+f.key+'" value="'+(f.value!==undefined?f.value:'').toString().replace(/"/g,'&quot;')+'" placeholder="'+(f.placeholder||'')+'" '+(f.step?('step="'+f.step+'"'):'')+'>';
        }
      }
      html += '</div>';
    });
    html += '<div class="modal-actions">';
    html += '<button type="button" class="btn btn-outline" data-close="1">취소</button>';
    html += '<button type="button" class="btn btn-teal" id="modal-save-btn">'+(opts.submitLabel||'저장')+'</button>';
    html += '</div>';
    if(opts.onDelete){
      html += '<button type="button" class="modal-delete-link" id="modal-delete-btn">삭제하기</button>';
    }
    html += '</div></div></div>';
    root.innerHTML = html;

    root.querySelectorAll('[data-close]').forEach(function(el){
      el.addEventListener('click', closeModal);
    });
    document.getElementById('mb').addEventListener('click', function(e){
      if(e.target.id === 'mb') closeModal();
    });
    if(opts.onDelete){
      document.getElementById('modal-delete-btn').addEventListener('click', function(){
        opts.onDelete();
        closeModal();
      });
    }
    root.querySelectorAll('[data-key]').forEach(function(el){
      el.addEventListener('focus', function(){
        setTimeout(function(){
          el.scrollIntoView({block:'center', behavior:'smooth'});
        }, 300);
      });
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' && el.tagName !== 'TEXTAREA'){
          e.preventDefault();
          doSubmit();
        }
      });
    });

    function doSubmit(){
      try{
        var values = {};
        opts.fields.forEach(function(f){
          var el = root.querySelector('[data-key="'+f.key+'"]');
          if(!el) return;
          if(f.type === 'checkbox'){ values[f.key] = el.checked; }
          else if(f.type === 'number'){ values[f.key] = el.value === '' ? 0 : Number(el.value); }
          else { values[f.key] = el.value; }
        });
        var result = opts.onSubmit(values);
        if(result !== false) closeModal();
      }catch(err){
        console.error('modal submit error:', err);
        showToast('저장 중 문제가 생겼어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
      }
    }

    document.getElementById('modal-save-btn').addEventListener('click', doSubmit);
  }

  /* ---------------- render: root ---------------- */
  function render(){
    var root = document.getElementById('root');
    try{
      var html = '';
      html += renderAppBar();
      html += renderHero();
      html += '<div class="content">';
      if(state.tab === 'itinerary') html += renderItineraryTab();
      else if(state.tab === 'expenses') html += renderExpensesTab();
      else html += renderInfoTab();
      html += '</div>';
      html += renderTabBar();
      root.innerHTML = html;
      bindEvents();
    }catch(err){
      console.error('render error:', err);
      showToast('화면을 그리는 중 문제가 생겼어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
    }
  }

  function renderDayCard(day){
    var parts = day.date.split('-');
    var monthNum = parseInt(parts[1], 10);
    var dayNum = parseInt(parts[2], 10);
    var html = '<div class="day-card">';
    html += '<div class="day-side"><div class="wk">'+monthNum+'월</div><div class="num">'+dayNum+'</div><div class="mon">'+weekdayKo(day.date)+'요일</div></div>';
    html += '<div class="day-divider"></div>';
    html += '<div class="day-body">';
    html += '<div class="day-title-row"><div class="day-title">'+day.title+'</div><button class="day-menu-btn" data-action="edit-day" data-day="'+day.id+'">✎</button></div>';
    if(day.tip) html += '<div class="day-tip">'+day.tip+'</div>';
    day.items.forEach(function(item, i){
      var catColor = (ITEM_CATS[item.cat]||ITEM_CATS['기타']).color;
      html += '<div class="item-row">';
      html += '<div class="item-time">'+item.time+'</div>';
      html += '<input type="checkbox" class="item-check" data-action="toggle-item" data-day="'+day.id+'" data-item="'+item.id+'" '+(item.done?'checked':'')+'>';
      html += '<div class="item-dot" style="background:'+catColor+';"></div>';
      html += '<div class="item-main">';
      if(item.link){
        html += '<a class="item-title-link'+(item.done?' done':'')+'" href="'+item.link+'" target="_blank" rel="noopener noreferrer"><span class="item-title'+(item.done?' done':'')+'" style="display:inline;">'+item.title+'</span><svg class="ext-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
      } else {
        html += '<div class="item-title'+(item.done?' done':'')+'">'+item.title+'</div>';
      }
      if(item.place) html += '<div class="item-place">'+item.place+'</div>';
      if(item.note) html += '<div class="item-note">'+item.note+'</div>';
      if(item.link){
        html += '<a class="item-link-chip" href="'+item.link+'" target="_blank" rel="noopener noreferrer">🔗 '+linkDomain(item.link)+' 바로가기</a>';
      }
      html += '</div>';
      html += '<div class="item-actions">';
      html += '<button class="btn-icon" data-action="edit-item" data-day="'+day.id+'" data-item="'+item.id+'">✎</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '<button class="add-item-btn" data-action="add-item" data-day="'+day.id+'">+ 일정 추가</button>';
    html += '</div></div>';
    return html;
  }

  /* ---------------- expenses tab ---------------- */
  function renderExpensesTab(){
    // 상태: 'planned'(예상) / 'confirmed'(결제 확정). 상태 없는 기존 기록은 확정으로 취급.
    var confirmedTotal = 0, plannedTotal = 0;
    state.expenses.forEach(function(e){
      if(e.status === 'planned') plannedTotal += Number(e.amount||0);
      else confirmedTotal += Number(e.amount||0);
    });
    var grandTotal = confirmedTotal + plannedTotal;

    var html = '<div class="section-title"><span class="st-label">'+LEAF_ICON+'경비 기록</span><button class="btn btn-coral btn-sm" data-action="add-expense">+ 지출 추가</button></div>';
    html += '<div class="section-sub">예상 금액으로 미리 잡아두고, 결제되면 "확정" 버튼으로 확정 금액을 입력하세요.</div>';

    html += '<div class="exp-summary"><div><div class="lbl">결제 확정 합계</div><div class="amt">'+fmtMoney(confirmedTotal)+'</div>'
          + '<div class="exp-sub-totals">예상 '+fmtMoney(plannedTotal)+' · 총 예상 경비 '+fmtMoney(grandTotal)+'</div></div>'
          + '<div class="count">전체 '+state.expenses.length+'건</div></div>';

    if(state.expenses.length > 0){
      var byPayer = {};
      state.expenses.forEach(function(e){
        if(!e.payer || e.status === 'planned') return;
        byPayer[e.payer] = (byPayer[e.payer]||0) + Number(e.amount||0);
      });

      // flat list, most recently added first
      state.expenses.slice().reverse().forEach(function(e){
        var payer = state.tripInfo.travelers.find(function(t){ return t.id===e.payer; });
        var isPlanned = e.status === 'planned';
        html += '<div class="exp-row'+(isPlanned?' planned':'')+'">';
        html += '<div class="exp-info"><div class="exp-desc">'
              + '<span class="exp-badge '+(isPlanned?'badge-planned':'badge-confirmed')+'">'+(isPlanned?'예상':'확정')+'</span>'
              + e.description+'</div><div class="exp-meta">'+(payer?payer.name+' 결제':'결제자 미지정')+'</div>'+(e.note?'<div class="exp-note">'+e.note+'</div>':'')+'</div>';
        html += '<div class="exp-amt'+(isPlanned?' amt-planned':'')+'">'+fmtMoney(e.amount)+'</div>';
        html += '<div class="exp-actions">';
        if(isPlanned){
          html += '<button class="btn btn-teal btn-sm" data-action="confirm-expense" data-exp="'+e.id+'">확정</button>';
        }
        html += '<button class="btn-icon" data-action="edit-expense" data-exp="'+e.id+'">✎</button>';
        html += '<button class="btn-icon" data-action="delete-expense" data-exp="'+e.id+'">🗑</button>';
        html += '</div>';
        html += '</div>';
      });

      // payer summary (확정만)
      var payerIds = Object.keys(byPayer);
      if(payerIds.length){
        html += '<div class="payer-summary"><div class="exp-group-label" style="margin-top:0;">결제자별 합계 (확정 기준)</div>';
        payerIds.forEach(function(pid){
          var t = state.tripInfo.travelers.find(function(t){ return t.id===pid; });
          html += '<div class="payer-row"><div class="pname">'+(t?t.name:'알 수 없음')+'</div><div class="pamt">'+fmtMoney(byPayer[pid])+'</div></div>';
        });
        html += '</div>';
      }
    } else {
      html += '<div class="empty-state"><div class="em-title">아직 기록된 지출이 없어요</div><div class="em-sub">‘+ 지출 추가’ 버튼으로 예상 경비부터 잡아보세요.</div></div>';
    }
    return html;
  }

  function openExpenseModal(expId, forceConfirm){
    var exp = expId ? state.expenses.find(function(e){ return e.id===expId; }) : null;
    var travelerOptions = [{value:'', label:'선택 안 함'}].concat(state.tripInfo.travelers.map(function(t){ return {value:t.id, label:t.name}; }));
    var statusOptions = [{value:'planned', label:'예상 금액'}, {value:'confirmed', label:'결제 확정'}];
    var initialStatus = forceConfirm ? 'confirmed' : (exp ? (exp.status || 'confirmed') : 'planned');
    openModal({
      title: forceConfirm ? '결제 확정 금액 입력' : (exp ? '지출 수정' : '지출 추가'),
      fields:[
        {key:'description', label:'내용', type:'text', value: exp?exp.description:'', placeholder:'예: 블루마운틴 투어 비용'},
        {key:'amount', label: forceConfirm ? '확정 금액 (원)' : '금액 (원)', type:'number', value: exp?exp.amount:'', step:'1000', placeholder:'예: 50000'},
        {key:'status', label:'구분', type:'select', value: initialStatus, options: statusOptions},
        {key:'payer', label:'결제자', type:'select', value: exp?exp.payer:'', options: travelerOptions},
        {key:'note', label:'비고 (선택)', type:'textarea', value: exp?exp.note:'', placeholder:'예: 카드 결제, 나중에 환불 예정 등'}
      ],
      submitLabel: forceConfirm ? '확정 저장' : '저장',
      onSubmit:function(v){
        if(!v.description || !v.amount){ showToast('내용과 금액을 입력해주세요.'); return false; }
        if(exp){
          exp.description=v.description; exp.amount=v.amount; exp.status=v.status; exp.payer=v.payer; exp.note=v.note;
        } else {
          state.expenses.push({id:uid(), description:v.description, amount:v.amount, status:v.status, payer:v.payer, note:v.note});
        }
        saveExpenses(); render(); showToast(v.status==='confirmed' ? '결제 확정으로 저장했어요.' : '예상 경비로 저장했어요.');
      },
      onDelete: exp ? function(){
        state.expenses = state.expenses.filter(function(e){ return e.id !== expId; });
        saveExpenses(); render(); showToast('지출을 삭제했어요.');
      } : null
    });
  }

      fields:[
        {key:'name', label:'이름 또는 호칭', type:'text', value: t?t.name:'', placeholder:'예: 아빠, 지민'},
        {key:'role', label:'구분', type:'text', value: t?t.role:'', placeholder:'예: 어른, 초2, 70대'}
      ],
      onSubmit:function(v){
        if(!v.name){ showToast('이름을 입력해주세요.'); return false; }
        if(t){ t.name=v.name; t.role=v.role; }
        else { state.tripInfo.travelers.push({id:uid(), name:v.name, role:v.role||'가족'}); }
        saveTripInfo(); render(); showToast('저장했어요.');
      },
      onDelete: t ? function(){
        state.tripInfo.travelers = state.tripInfo.travelers.filter(function(x){ return x.id !== tid; });
        saveTripInfo(); render(); showToast('삭제했어요.');
      } : null
    });
  }

  /* ---------------- events ---------------- */
  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(function(el){
      el.addEventListener('click', function(){
        state.tab = el.getAttribute('data-tab');
        render();
      });
    });

    document.querySelectorAll('[data-action="add-item"]').forEach(function(el){
      el.addEventListener('click', function(){ openItemModal(el.getAttribute('data-day'), null); });
    });
    document.querySelectorAll('[data-action="edit-item"]').forEach(function(el){
      el.addEventListener('click', function(){ openItemModal(el.getAttribute('data-day'), el.getAttribute('data-item')); });
    });
    document.querySelectorAll('[data-action="edit-day"]').forEach(function(el){
      el.addEventListener('click', function(){ openDayModal(el.getAttribute('data-day')); });
    });
    document.querySelectorAll('[data-action="toggle-item"]').forEach(function(el){
      el.addEventListener('change', function(){
        var day = state.itinerary.find(function(d){ return d.id === el.getAttribute('data-day'); });
        var item = day.items.find(function(i){ return i.id === el.getAttribute('data-item'); });
        item.done = el.checked;
        saveItinerary(); render();
      });
    });
    var resetBtn = document.querySelector('[data-action="reset-itinerary"]');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        if(resetBtn.getAttribute('data-confirm') === '1'){
          state.itinerary = defaultItinerary();
          saveItinerary(); render(); showToast('처음 일정으로 되돌렸어요.');
        } else {
          resetBtn.setAttribute('data-confirm', '1');
          resetBtn.textContent = '한 번 더 누르면 초기화';
          showToast('수정 내용이 사라져요. 한 번 더 누르면 초기화됩니다.');
          setTimeout(function(){
            if(resetBtn && resetBtn.getAttribute('data-confirm') === '1'){
              resetBtn.setAttribute('data-confirm', '0');
              resetBtn.textContent = '되돌리기';
            }
          }, 3500);
        }
      });
    }

    var addExpBtn = document.querySelector('[data-action="add-expense"]');
    if(addExpBtn) addExpBtn.addEventListener('click', function(){ openExpenseModal(null); });
    document.querySelectorAll('[data-action="edit-expense"]').forEach(function(el){
      el.addEventListener('click', function(){ openExpenseModal(el.getAttribute('data-exp')); });
    });
    document.querySelectorAll('[data-action="confirm-expense"]').forEach(function(el){
      el.addEventListener('click', function(){ openExpenseModal(el.getAttribute('data-exp'), true); });
    });
    document.querySelectorAll('[data-action="delete-expense"]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-exp');
        var removed = state.expenses.filter(function(e){ return e.id === id; })[0];
        state.expenses = state.expenses.filter(function(e){ return e.id !== id; });
        saveExpenses(); render();
        showToast(removed ? ('삭제했어요: ' + removed.description) : '삭제했어요.');
      });
    });

    var accomBtn = document.querySelector('[data-action="edit-accom"]');
    if(accomBtn) accomBtn.addEventListener('click', openAccomModal);
    var hotelBtn = document.querySelector('[data-action="edit-hotel"]');
    if(hotelBtn) hotelBtn.addEventListener('click', openHotelModal);
    var addTravelerBtn = document.querySelector('[data-action="add-traveler"]');
    if(addTravelerBtn) addTravelerBtn.addEventListener('click', function(){ openTravelerModal(null); });
    document.querySelectorAll('[data-action="edit-traveler"]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); openTravelerModal(el.getAttribute('data-tid')); });
    });
    document.querySelectorAll('[data-action="copy-addr"]').forEach(function(el){
      el.addEventListener('click', function(){
        var addr = el.getAttribute('data-addr');
        try{
          navigator.clipboard.writeText(addr);
          showToast('주소를 복사했어요.');
        }catch(e){ showToast('복사에 실패했어요.'); }
      });
    });

    var notesArea = document.getElementById('shared-notes');
    if(notesArea){
      var notesTimer = null;
      notesArea.addEventListener('input', function(){
        state.tripInfo.notes = notesArea.value;
        if(notesTimer) clearTimeout(notesTimer);
        notesTimer = setTimeout(function(){ saveTripInfo(); }, 700);
      });
    }
  }

  /* ---------------- live sync ---------------- */
  function isTypingActive(){
    var el = document.activeElement;
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
  }

  async function autoRefresh(){
    if(state.modalOpen || isTypingActive()) return;
    try{
      await loadAll();
      render();
    }catch(e){ /* silent fail, keep showing last known state */ }
  }

  /* ---------------- init ---------------- */
  async function init(){
    await loadAll();
    render();
    setInterval(autoRefresh, 20000); // 폴백: Firestore가 안 붙었을 때도 20초마다 시도
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) autoRefresh();
    });
    window.addEventListener('focus', autoRefresh);

    // Firestore 실시간 동기화: 다른 사람이 고치면 몇 초 안 걸려서 바로 반영돼요
    if(typeof firebaseReady !== 'undefined' && firebaseReady && db){
      ['trip-info','itinerary','expenses'].forEach(function(key){
        db.collection(TRAVELLET_COLLECTION).doc(key).onSnapshot(function(){
          autoRefresh();
        }, function(err){
          console.error('실시간 동기화 오류:', err);
        });
      });
    }
  }
  init();
})();
</script>
</body>
</html>
